name: Hanabi Website Watch

on:
  schedule:
    # UTC 時間，對應台灣時間 (UTC+8) 早上 9:00 與晚上 18:00
    - cron: '0 1,10 * * *'
  workflow_dispatch: {}   # 允許手動在 GitHub 網頁上點一下立刻執行測試

permissions:
  contents: write   # 需要寫入權限才能把最新快照 commit 回 repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run check script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check_hanabi.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/last_snapshot.txt
          git diff --quiet --cached || git commit -m "Update snapshot [skip ci]"
          git push
